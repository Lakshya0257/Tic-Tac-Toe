version: "3.9"

services:
  postgres:
    container_name: lila_postgres
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: nakama
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nakama"]
      interval: 5s
      timeout: 5s
      retries: 10

  nakama:
    container_name: lila_nakama
    image: registry.heroiclabs.com/heroiclabs/nakama:3.22.0
    restart: unless-stopped
    entrypoint:
      - "/bin/sh"
      - "-ecx"
      - >
        /nakama/nakama migrate up
        --database.address postgres:${DB_PASSWORD}@postgres:5432/nakama &&
        exec /nakama/nakama
        --config /nakama/data/local.yml
        --database.address postgres:${DB_PASSWORD}@postgres:5432/nakama
    volumes:
      - ../server/build:/nakama/data/modules
      - ../server/data:/nakama/data
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    container_name: lila_nginx
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ../client/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - nakama

volumes:
  pgdata:
